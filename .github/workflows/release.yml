# Release the zz-meridian package (decision 0009, docs/distribution.md): gates, pack, the consumer path end to end,
# then publish with provenance, then tag LAST. Modelled on multi-model-agent's release pipeline.
#
# WHY TWO JOBS. `gates` installs the template's dependencies and runs their code (the build, the tests, Chrome); it
# never holds a publishing credential. `publish` installs nothing: it takes the one tarball `gates` tested, checks its
# hash, and is the only job with id-token: write. A compromised dependency can fail a release; it cannot publish one.
#
# WHY THE TAG IS LAST. The tag proves a finished release. Nothing is tagged until the package is on the registry and a
# consumer has run it, so "tagged but not on npm" cannot happen.
#
# Every action is pinned to a commit, not a tag that can move. The version input is read through an environment
# variable and checked against semver before any shell sees it.
#
# SETUP, ONCE (npmjs.com → zz-meridian → Settings → Trusted publisher → GitHub Actions):
#   owner: zhixuan312   repository: zz-meridian   workflow: release.yml   environment: (none)
# That pins THIS FILENAME: renaming it breaks publishing until the setting is updated.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must equal cli/package.json on master'
        required: true
        type: string
      dry_run:
        description: 'Gates, pack and the consumer smoke only: publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      tarball: ${{ steps.pack.outputs.tarball }}
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The version is semver and matches every version location
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not semver"; exit 1; }
          for f in cli/package.json package.json; do
            V="$(node -p "require('./$f').version")"
            [ "$V" = "$VERSION" ] || { echo "::error::$f is $V, expected $VERSION (run node cli/scripts/set-version.ts)"; exit 1; }
          done
          grep -qF "## [$VERSION]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$VERSION] section"; exit 1; }

      - name: A real release comes from master, with an unused tag
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/master" ] || { echo "::error::releases are dispatched from master (got $GITHUB_REF)"; exit 1; }
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION exists: bump to a new version"; exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0   # the template has no packageManager pin (0.2.0); CI names the pnpm it tests with
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: The template's gate
        run: pnpm gate
      - name: The template builds
        run: pnpm exec next build

      - name: Build the package from the committed tree
        run: |
          set -euo pipefail
          node cli/scripts/build-payload.ts
          pnpm exec tsc -p cli/tsconfig.json
          OUT="$(node cli/dist/cli.js --version)"
          [ "$OUT" = "$VERSION" ] || { echo "::error::the CLI reports '$OUT', expected $VERSION"; exit 1; }

      - name: Pack, and assert the tarball before anything is irreversible
        id: pack
        run: |
          set -euo pipefail
          cd cli
          npm pack --pack-destination /tmp/pack >/dev/null
          T="/tmp/pack/zz-meridian-$VERSION.tgz"
          test -f "$T" || { echo "::error::no tarball at $T"; exit 1; }
          tar -tzf "$T" > /tmp/list
          read -r FIRST < <(tar -xzOf "$T" package/dist/cli.js)
          [ "$FIRST" = '#!/usr/bin/env node' ] || { echo "::error::dist/cli.js starts '$FIRST', not the node shebang"; exit 1; }
          for f in payload/skills/zz-meridian/SKILL.md payload/skills/zz-meridian/references/existing-project.md payload/package.json payload/app/globals.css payload/scripts/gate.ts; do
            grep -qx "package/$f" /tmp/list || { echo "::error::tarball lacks $f"; exit 1; }
          done
          CARDS=$(grep -cE '^package/payload/src/components/[a-z]+/[a-z0-9-]+/index\.tsx$' /tmp/list || true)
          [ "$CARDS" -ge 60 ] || { echo "::error::only $CARDS component folders in the payload"; exit 1; }
          if grep -P '^package/(node_modules|test|scripts|src)/|^package/payload/(cli|\.github|\.claude|\.agents|node_modules|out|\.next)/|/\.env($|\.(?!example$))' /tmp/list; then
            echo "::error::the tarball holds a path that must never ship (above)"; exit 1
          fi
          tar -xzOf "$T" package/package.json > /tmp/pkg.json
          node -e 'const p=require("/tmp/pkg.json"); if (p.scripts && Object.keys(p.scripts).some(k=>/install|prepare|prepack|postpack/.test(k))) { console.error("::error::the package declares an install script"); process.exit(1) }'
          echo "sha256=$(sha256sum "$T" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "tarball=zz-meridian-$VERSION.tgz" >> "$GITHUB_OUTPUT"
          echo "tarball OK: $CARDS components, $(wc -l < /tmp/list) files"

      - name: The consumer path, from the tarball
        run: node cli/scripts/smoke.ts --tarball "/tmp/pack/zz-meridian-$VERSION.tgz" --create --verify

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: /tmp/pack/zz-meridian-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: gates
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # the tag and the Release, both last
      id-token: write   # npm trusted publishing, and the provenance signature
    env:
      VERSION: ${{ inputs.version }}
      SHA256: ${{ needs.gates.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: /tmp/pack

      - name: The tarball is the one the gates tested
        run: |
          set -euo pipefail
          GOT="$(sha256sum "/tmp/pack/zz-meridian-$VERSION.tgz" | cut -d' ' -f1)"
          [ "$GOT" = "$SHA256" ] || { echo "::error::tarball hash $GOT is not the tested $SHA256"; exit 1; }

      - name: An npm new enough for trusted publishing, and an OIDC token
        run: |
          set -euo pipefail
          npm install -g npm@latest
          V="$(npm --version)"
          node -e 'const v=process.argv[1].split(".").map(Number); if (!(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1))))) { console.error("::error::npm "+process.argv[1]+" predates trusted publishing (need 11.5.1)"); process.exit(1) }' "$V"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo '::error::no OIDC token: permissions id-token: write'; exit 1; }

      # npm, not pnpm: pnpm publish does not perform the OIDC exchange (multi-model-agent 5.16.1).
      - name: Publish
        run: |
          set -euo pipefail
          LIVE="$(npm view "zz-meridian@$VERSION" version 2>/dev/null || true)"
          if [ "$LIVE" = "$VERSION" ]; then
            echo "::notice::zz-meridian $VERSION is already on the registry: skipping the publish"
          else
            npm publish "/tmp/pack/zz-meridian-$VERSION.tgz" --access public --provenance
          fi

      - name: Wait until the registry serves it
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            [ "$(npm view "zz-meridian@$VERSION" version 2>/dev/null || true)" = "$VERSION" ] && { echo "live"; exit 0; }
            echo "attempt $i: not visible yet"; sleep 10
          done
          echo "::error::zz-meridian $VERSION never became visible"; exit 1

      - name: A consumer runs it from the registry
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          OUT="$(npx --yes "zz-meridian@$VERSION" --version)"
          [ "$OUT" = "$VERSION" ] || { echo "::error::npx zz-meridian@$VERSION reported '$OUT'"; exit 1; }
          npm view "zz-meridian@$VERSION" dist.attestations >/dev/null 2>&1 && echo "provenance attached" || echo "::warning::no provenance attestation reported"

      - name: Tag, last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA" >/dev/null
          echo "tagged v$VERSION at $GITHUB_SHA"

      - name: GitHub Release, with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" 'index($0, "## [" v "]")==1 {on=1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > /tmp/notes.md
          printf '\n---\nnpm: https://www.npmjs.com/package/zz-meridian/v/%s\n' "$VERSION" >> /tmp/notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/notes.md --verify-tag
