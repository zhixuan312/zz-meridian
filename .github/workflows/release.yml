# Release the zz-meridian package (decisions 0009 and 0010, docs/distribution.md): the checks, pack, the consumer path
# end to end, then publish with provenance, then tag LAST.
#
# WHAT GATES A RELEASE. The checks that decide whether this tarball works, each run once, each its own job on its own
# clock: the static stage (lint, the type check, every Vitest file but the browser-fixture tests), the four browser
# sweeps (audit, interactions, keyboard, rest), the browser-fixture tests the changes since the release before reach
# (two parallel legs), and the consumer smoke from the tarball, which adopts, creates (test:t1, a production build and
# the rest sweep in the new dashboard), and updates a project of the release before (adopted and created) to finalize.
# Tier 2 (timing, size) runs beside them, is reported, and gates nothing. The update from the last three releases runs
# weekly; the window moves with each release and never grows. The recovery and failure matrices and the created
# dashboard's whole suite run weekly (weekly.yml) and never here: weekly is weekly, release is release.
# After publishing, the registry's tarball is compared byte for byte with the tested one; identical bytes are not tested
# twice. Two short steps run against the registry, since they behave differently once the version is published:
# create from it, and update to it from the release before.
#
# WHY THESE JOBS. `build` makes the tarball with nothing but Node, git and a pinned TypeScript installed without its
# scripts, and records its hash. The check jobs install the template's dependencies and run their code (Chrome)
# against that commit and tarball; they cannot change the tarball and hold no credential. `publish` installs nothing,
# checks the hash, and is the only job with id-token: write, inside the `npm` environment, which only master may use.
# `release` checks the registry serves the tested tarball with provenance, then tags and writes the Release, without the
# publishing token. `tier2-attach` then puts the Tier 2 record, history and table on the Release.
#
# WHY THE TAG IS LAST. The tag proves a finished release. Nothing is tagged until the package is on the registry and a
# consumer has run it, so "tagged but not on npm" cannot happen. It never waits for Tier 2.
#
# Every action is pinned to a commit, not a tag that can move. The version input is read through an environment
# variable and checked against semver before any shell sees it.
#
# SETUP, ONCE (npmjs.com → zz-meridian → Settings → Trusted publisher → GitHub Actions):
#   owner: zhixuan312   repository: zz-meridian   workflow: release.yml   environment: npm
# and in this repository, Settings → Environments → npm, deployment branches: master only.
# That pins THIS FILENAME: renaming it breaks publishing until the setting is updated.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must equal cli/package.json on master'
        required: true
        type: string
      dry_run:
        description: 'Build, checks and the consumer smoke only: publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: The version is major.minor.patch and matches every version location
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not major.minor.patch: update refuses to run a prerelease"; exit 1; }
          for f in cli/package.json package.json; do
            V="$(node -p "require('./$f').version")"
            [ "$V" = "$VERSION" ] || { echo "::error::$f is $V, expected $VERSION (run node cli/scripts/set-version.ts)"; exit 1; }
          done
          grep -qF "## [$VERSION]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$VERSION] section"; exit 1; }

      - name: A real release comes from master, with an unused tag
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/master" ] || { echo "::error::releases are dispatched from master (got $GITHUB_REF)"; exit 1; }
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION exists: bump to a new version"; exit 1
          fi

      # Only a pinned compiler, without install scripts: nothing else runs before the hash is taken.
      - name: Build the package from the committed tree
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tooling --no-save --no-package-lock --ignore-scripts typescript@5.9.3 @types/node@24.19.1
          node cli/scripts/build-payload.ts
          /tmp/tooling/node_modules/.bin/tsc -p cli/tsconfig.json --typeRoots /tmp/tooling/node_modules/@types
          OUT="$(node cli/dist/cli.js --version)"
          [ "$OUT" = "$VERSION" ] || { echo "::error::the CLI reports '$OUT', expected $VERSION"; exit 1; }

      - name: Pack, and assert the tarball before anything is irreversible
        id: pack
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          cd cli
          npm pack --ignore-scripts --pack-destination /tmp/pack >/dev/null
          T="/tmp/pack/zz-meridian-$VERSION.tgz"
          test -f "$T" || { echo "::error::no tarball at $T"; exit 1; }
          tar -tzf "$T" > /tmp/list
          read -r FIRST < <(tar -xzOf "$T" package/dist/cli.js)
          [ "$FIRST" = '#!/usr/bin/env node' ] || { echo "::error::dist/cli.js starts '$FIRST', not the node shebang"; exit 1; }
          for f in payload/skills/zz-meridian/SKILL.md payload/skills/zz-meridian/references/existing-project.md payload/package.json payload/app/globals.css payload/scripts/test-run.ts; do
            grep -qx "package/$f" /tmp/list || { echo "::error::tarball lacks $f"; exit 1; }
          done
          CARDS=$(grep -cE '^package/payload/src/components/[a-z]+/[a-z0-9-]+/index\.tsx$' /tmp/list || true)
          [ "$CARDS" -ge 60 ] || { echo "::error::only $CARDS component folders in the payload"; exit 1; }
          # A payload .gitignore is renamed .npmignore when npm installs the package: it ships as payload/gitignore.
          if grep -P '^package/(node_modules|test|scripts|src)/|^package/payload/(cli|\.github|\.claude|\.agents|node_modules|out|\.next)/|/\.env($|\.(?!example$))|^package/payload/(.*/)?\.gitignore$' /tmp/list; then
            echo "::error::the tarball holds a path that must never ship (above)"; exit 1
          fi
          tar -xzOf "$T" package/package.json > /tmp/pkg.json
          node -e 'const p=require("/tmp/pkg.json"); if (p.dependencies||p.optionalDependencies||p.peerDependencies) { console.error("::error::the package declares dependencies"); process.exit(1) } if (p.scripts && Object.keys(p.scripts).length) { console.error("::error::the package declares scripts"); process.exit(1) }'
          echo "sha256=$(sha256sum "$T" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "tarball OK: $CARDS components, $(wc -l < /tmp/list) files"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: /tmp/pack/zz-meridian-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  # The static stage: lint, the type check and every Vitest file but the browser-fixture tests. The template snapshot
  # the package carries is a build output, so a fresh checkout has none, and the package's own tests read it (`adopt`'s
  # configuration and skill tests). Built from HEAD, which is the release commit here.
  static:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0   # the template has no packageManager pin (0.2.0); CI names the pnpm it tests with
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The template snapshot the package carries
        run: node cli/scripts/build-payload.ts
      - name: The static stage
        run: |
          set -euo pipefail
          node scripts/test-run.ts stage static

  # The four browser sweeps, one job each so they run side by side and `publish` can name each one. Each builds the
  # template once and drives one sweep against it; on a failure the whole `out/` is kept under the sweep's name.
  sweep-audit:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The audit sweep
        run: |
          set -euo pipefail
          node scripts/test-run.ts stage sweep audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: sweep-audit
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  sweep-interactions:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The interactions sweep
        run: |
          set -euo pipefail
          node scripts/test-run.ts stage sweep interactions
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: sweep-interactions
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  sweep-keyboard:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The keyboard sweep
        run: |
          set -euo pipefail
          node scripts/test-run.ts stage sweep keyboard
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: sweep-keyboard
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  # The rest sweep also runs the route policy after the build.
  sweep-rest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The rest sweep and the route policy
        run: |
          set -euo pipefail
          node scripts/test-run.ts stage sweep rest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: sweep-rest
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  # The browser-fixture tests (tests/deep-*) the changes since the release before reach, in two parallel legs. The
  # checkout holds the whole history and the tags, so the previous release's tag resolves. When it does not (no release
  # before this one, or its tag was never pushed), the base is the repository's first commit and every deep test runs.
  deep:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      VERSION: ${{ inputs.version }}
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The base the deep tests compare with
        run: |
          set -euo pipefail
          PREV="$(npm view zz-meridian versions --json | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8")).filter((x)=>/^\d+\.\d+\.\d+$/.test(x));const n=(x)=>x.split(".").map(Number);const lt=(a,b)=>{const p=n(a),q=n(b);for(let i=0;i<3;i++)if(p[i]!==q[i])return p[i]<q[i];return false};console.log(v.filter((x)=>lt(x,process.env.VERSION)).sort((a,b)=>lt(a,b)?-1:1).at(-1)??"")')"
          PREVIOUS_TAG="v$PREV"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREVIOUS_TAG" >/dev/null; then
            BASE="$PREVIOUS_TAG"
            echo "base: $BASE, the release before this one"
          else
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "base: $BASE, the first commit (no release before this one has a tag here), so every deep test runs"
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: The deep tests, part ${{ matrix.part }} of 2
        run: |
          set -euo pipefail
          node scripts/test-run.ts stage deep --since "$BASE" --part ${{ matrix.part }}/2

  # Tier 2: measured and reported, never a gate. The job cannot fail the run (`continue-on-error`), `publish` does not
  # wait for it and neither does the tag. Its record travels to `tier2-attach`, which puts it on the Release.
  tier2:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The release before this one, and the history its Release carries: the values this run is compared with. A
      # missing asset (the first release with a history) is tolerated: the run then compares with the seed.
      - name: The release before this one, and its Tier 2 history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV="$(npm view zz-meridian versions --json | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8")).filter((x)=>/^\d+\.\d+\.\d+$/.test(x));const n=(x)=>x.split(".").map(Number);const lt=(a,b)=>{const p=n(a),q=n(b);for(let i=0;i<3;i++)if(p[i]!==q[i])return p[i]<q[i];return false};console.log(v.filter((x)=>lt(x,process.env.VERSION)).sort((a,b)=>lt(a,b)?-1:1).at(-1)??"")')"
          echo "PREVIOUS_TAG=v$PREV" >> "$GITHUB_ENV"
          if [ -n "$PREV" ]; then
            gh release download "v$PREV" --pattern perf-history.json --dir scripts || echo "::notice::v$PREV carries no perf-history.json: the run compares with the seed"
          fi
      - name: The Tier 2 stage
        run: |
          set -euo pipefail
          node scripts/test-run.ts stage tier2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: tier2-record
          path: out/perf-record.json
          if-no-files-found: ignore
          retention-days: 30

  # The consumer path, from the tarball `build` made: adopt and create from the release before, update both to this
  # one, create a new dashboard from the tarball and run that dashboard's `test:t1`, `next build` and rest sweep. It
  # runs beside the stages above, each on its own clock. The created dashboard's whole suite is weekly's, not this job's.
  # This job holds no publishing permission and no credential.
  consumer:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: /tmp/pack
      - name: The consumer path, from the built tarball, with the release before updated to finalize
        run: |
          set -euo pipefail
          T="/tmp/pack/zz-meridian-$VERSION.tgz"
          [ "$(sha256sum "$T" | cut -d' ' -f1)" = "$SHA256" ] || { echo "::error::the tarball is not the one build made"; exit 1; }
          node cli/scripts/smoke.ts --tarball "$T" --adopt --create --created-rest --update
      # A red here names its cause: when the created dashboard's test:t1 or build fails, the smoke writes its whole
      # stdout and stderr here (`out/consumer-test-release.*.txt`) and prints its verdict and FAIL lines to the log.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consumer-test
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [build, static, sweep-audit, sweep-interactions, sweep-keyboard, sweep-rest, deep, consumer]
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm   # deployment branches: master only; named in npm's trusted-publisher setting
    permissions:
      contents: read
      id-token: write   # npm trusted publishing, and the provenance signature
    env:
      VERSION: ${{ inputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      # Node 24's own npm does the OIDC exchange: nothing is installed in the job that can publish.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: /tmp/pack

      - name: The tarball is the one build made and the checks tested; npm can do trusted publishing
        run: |
          set -euo pipefail
          GOT="$(sha256sum "/tmp/pack/zz-meridian-$VERSION.tgz" | cut -d' ' -f1)"
          [ "$GOT" = "$SHA256" ] || { echo "::error::tarball hash $GOT is not $SHA256"; exit 1; }
          V="$(npm --version)"
          node -e 'const v=process.argv[1].split(".").map(Number); if (!(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1))))) { console.error("::error::npm "+process.argv[1]+" predates trusted publishing (need 11.5.1)"); process.exit(1) }' "$V"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo '::error::no OIDC token: permissions id-token: write'; exit 1; }

      # npm, not pnpm: pnpm publish does not perform the OIDC exchange.
      - name: Publish
        run: |
          set -euo pipefail
          LIVE="$(npm view "zz-meridian@$VERSION" version 2>/dev/null || true)"
          if [ "$LIVE" = "$VERSION" ]; then
            echo "::notice::zz-meridian $VERSION is already on the registry: skipping the publish"
          else
            npm publish "/tmp/pack/zz-meridian-$VERSION.tgz" --access public --provenance --ignore-scripts
          fi

      - name: Wait until the registry serves it
        # npm says a new version "may take a few minutes to become available": 0.6.0 took longer than 3 minutes. The
        # version's metadata arrives before its tarball does (0.9.0's tarball still answered 404 after its metadata was
        # live), so it is live only once the tarball itself downloads.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if [ "$(npm view "zz-meridian@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              URL="$(npm view "zz-meridian@$VERSION" dist.tarball 2>/dev/null || true)"
              [ -n "$URL" ] && curl -fsSI "$URL" >/dev/null 2>&1 && { echo "live: $URL"; exit 0; }
              echo "attempt $i: visible, tarball not downloadable yet"
            else
              echo "attempt $i: not visible yet"
            fi
            sleep 10
          done
          echo "::error::zz-meridian $VERSION never became downloadable"; exit 1

  release:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the tag and the Release, both last
    env:
      VERSION: ${{ inputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # A failure here is an unsuccessful release, not a rollback: the version stays published and untagged.
      - name: A consumer runs it from the registry, and it is the tested tarball with provenance
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          OUT="$(npx --yes "zz-meridian@$VERSION" --version)"
          [ "$OUT" = "$VERSION" ] || { echo "::error::npx zz-meridian@$VERSION reported '$OUT'"; exit 1; }
          npm pack "zz-meridian@$VERSION" --ignore-scripts >/dev/null
          GOT="$(sha256sum "zz-meridian-$VERSION.tgz" | cut -d' ' -f1)"
          # The tested bytes passed the consumer path; the registry's copy must be those bytes, since nothing reruns it.
          [ "$GOT" = "$SHA256" ] || { echo "::error::the registry's tarball hash $GOT differs from the tested $SHA256"; exit 1; }
          echo "the registry serves the tested tarball"
          # npm view prints nothing and exits 0 for a field that is not there, so the check reads the output.
          ATT="$(npm view "zz-meridian@$VERSION" dist.attestations.provenance --json 2>/dev/null || true)"
          [ -n "$ATT" ] || { echo "::error::zz-meridian $VERSION carries no provenance attestation"; exit 1; }
          echo "provenance attached"

      # What the consumer job cannot reach: the version published. `update` compares the running package with the registry's only
      # then, and a project is created from the installed package, which npm has renamed files in. About 10 seconds.
      - name: A consumer creates from the registry, and updates to it from the release before
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npx --yes --prefer-online "zz-meridian@$VERSION" create fresh --no-install >/dev/null
          [ -f fresh/.gitignore ] && [ ! -e fresh/.npmignore ] || { echo "::error::a project created from the registry has no .gitignore"; exit 1; }
          PREV="$(npm view zz-meridian versions --json | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8")).filter((x)=>/^\d+\.\d+\.\d+$/.test(x)); const n=(x)=>x.split(".").map(Number); const lt=(a,b)=>{const p=n(a),q=n(b);for(let i=0;i<3;i++)if(p[i]!==q[i])return p[i]<q[i];return false}; console.log(v.filter((x)=>lt(x,process.env.VERSION)).sort((a,b)=>lt(a,b)?-1:1).at(-1)??"")')"
          [ -n "$PREV" ] || { echo "::error::no release before $VERSION on the registry"; exit 1; }
          npx --yes "zz-meridian@$PREV" create older --no-install >/dev/null
          cd older && git init -q && git add -A && git -c user.name=release -c user.email=release@localhost commit -qm "created with $PREV"
          set +e; OUT="$(npx --yes --prefer-online "zz-meridian@$VERSION" update --no-install 2>&1)"; CODE=$?; set -e
          echo "$OUT" | tail -4
          # 0 is complete and 2 is applied with work pending; anything else, or a refusal, is a broken update.
          { [ "$CODE" -eq 0 ] || [ "$CODE" -eq 2 ]; } && ! grep -q '^zz-meridian update:' <<<"$OUT" && grep -q '^outcome: ' <<<"$OUT" || { echo "::error::npx zz-meridian@$VERSION update from a $PREV project exited $CODE"; exit 1; }
          echo "created from the registry with a .gitignore; updated from $PREV"

      - name: Tag, last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA" >/dev/null
          echo "tagged v$VERSION at $GITHUB_SHA"

      # The Release carries the changelog section only. The Tier 2 table and history are added by `tier2-attach` once the
      # timing run is done; the tag never waits for it.
      - name: GitHub Release, with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" 'index($0, "## [" v "]")==1 {on=1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > /tmp/notes.md
          printf '\n---\nnpm: https://www.npmjs.com/package/zz-meridian/v/%s\n' "$VERSION" >> /tmp/notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/notes.md --verify-tag

  # Tier 2, attached after the release: the record and the next history go on the Release as assets, and the table is
  # appended to its notes. A missing record (the timing run failed or was cancelled) leaves the Release as it is.
  tier2-attach:
    needs: [tier2, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the Release's assets and notes
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: tier2-record
          path: /tmp/tier2
      - name: The next history, from the release before this one's
        run: |
          set -euo pipefail
          if [ ! -f /tmp/tier2/perf-record.json ]; then
            echo "::notice::no Tier 2 record was produced: the Release is left as it is"
            exit 0
          fi
          PREV="$(npm view zz-meridian versions --json | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8")).filter((x)=>/^\d+\.\d+\.\d+$/.test(x));const n=(x)=>x.split(".").map(Number);const lt=(a,b)=>{const p=n(a),q=n(b);for(let i=0;i<3;i++)if(p[i]!==q[i])return p[i]<q[i];return false};console.log(v.filter((x)=>lt(x,process.env.VERSION)).sort((a,b)=>lt(a,b)?-1:1).at(-1)??"")')"
          mkdir -p /tmp/tier2/prev
          if [ -n "$PREV" ]; then
            gh release download "v$PREV" --pattern perf-history.json --dir /tmp/tier2/prev || echo "::notice::v$PREV carries no perf-history.json: this release starts the history"
          fi
          echo "PREVIOUS_TAG=v$PREV" >> "$GITHUB_ENV"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { nextHistory } from './scripts/lib/tier2.ts';
            const [recordFile, previousFile, outFile] = process.argv.slice(1);
            const record = JSON.parse(fs.readFileSync(recordFile, 'utf8'));
            const previous = fs.existsSync(previousFile) ? JSON.parse(fs.readFileSync(previousFile, 'utf8')) : null;
            fs.writeFileSync(outFile, JSON.stringify(nextHistory(previous, record), null, 1) + '\\n');
          " /tmp/tier2/perf-record.json /tmp/tier2/prev/perf-history.json /tmp/tier2/perf-history.json
      - name: The record and the history on the Release, and the table in its notes
        run: |
          set -euo pipefail
          [ -f /tmp/tier2/perf-history.json ] || { echo "::notice::nothing to attach"; exit 0; }
          gh release upload "v$VERSION" /tmp/tier2/perf-record.json /tmp/tier2/perf-history.json --clobber
          gh release view "v$VERSION" --json body --jq .body > /tmp/notes.md
          # The run's own table against the history, and the baseline's age. Reported, never a gate.
          node -e '
            const fs = require("fs");
            const record = JSON.parse(fs.readFileSync("/tmp/tier2/perf-record.json", "utf8"));
            const prevFile = "/tmp/tier2/prev/perf-history.json";
            const history = fs.existsSync(prevFile) ? JSON.parse(fs.readFileSync(prevFile, "utf8")) : { releases: [] };
            const newest = history.releases[0]?.version;
            const prev = (process.env.PREVIOUS_TAG || "").replace(/^v/, "");
            const lines = ["", "### Performance (Tier 2, reported, never a gate)", ""];
            lines.push(...(record.table || []).map((l) => `- ${l}`));
            if (newest && prev && newest !== prev) lines.push("", `- warn: baseline is ${newest}, the previous release is ${prev}; the comparison is against an older release`);
            fs.appendFileSync("/tmp/notes.md", lines.join("\n") + "\n");
          '
          gh release edit "v$VERSION" --notes-file /tmp/notes.md
