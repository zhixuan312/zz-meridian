# Release the zz-meridian package (decisions 0009 and 0010, docs/distribution.md): gates, pack, the consumer path end
# to end, then publish with provenance, then tag LAST.
#
# WHAT GATES A RELEASE. The checks that decide whether this tarball works, each run once: the template's default verify
# from a clean build, within 180 s on the shared 4-CPU runner (the gate with its unit tests runs inside it), and the
# consumer smoke from the tarball,
# which adopts, creates, and updates every published origin to finalize. The full walkthroughs, the 20-sample perf report
# and the recovery and failure matrices run weekly (weekly.yml) and never here: weekly is weekly, release is release.
# After publishing, the registry's tarball is compared byte for byte with the tested one; identical bytes are not tested
# twice.
#
# WHY FOUR JOBS. `build` makes the tarball with nothing but Node, git and a pinned TypeScript installed without its
# scripts, and records its hash. `gates` installs the template's dependencies and runs their code (the verifies, the
# build, the tests, Chrome) against that tarball; it cannot change it and holds no credential. `publish` installs nothing,
# checks the hash, and is the only job with id-token: write, inside the `npm` environment, which only master may use.
# `release` checks the registry serves the tested tarball with provenance, then tags and writes the Release, without the
# publishing token.
#
# WHY THE TAG IS LAST. The tag proves a finished release. Nothing is tagged until the package is on the registry and a
# consumer has run it, so "tagged but not on npm" cannot happen.
#
# Every action is pinned to a commit, not a tag that can move. The version input is read through an environment
# variable and checked against semver before any shell sees it.
#
# SETUP, ONCE (npmjs.com → zz-meridian → Settings → Trusted publisher → GitHub Actions):
#   owner: zhixuan312   repository: zz-meridian   workflow: release.yml   environment: npm
# and in this repository, Settings → Environments → npm, deployment branches: master only.
# That pins THIS FILENAME: renaming it breaks publishing until the setting is updated.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must equal cli/package.json on master'
        required: true
        type: string
      dry_run:
        description: 'Build, gates and the consumer smoke only: publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: The version is semver and matches every version location
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not semver"; exit 1; }
          for f in cli/package.json package.json; do
            V="$(node -p "require('./$f').version")"
            [ "$V" = "$VERSION" ] || { echo "::error::$f is $V, expected $VERSION (run node cli/scripts/set-version.ts)"; exit 1; }
          done
          grep -qF "## [$VERSION]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$VERSION] section"; exit 1; }

      - name: A real release comes from master, with an unused tag
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/master" ] || { echo "::error::releases are dispatched from master (got $GITHUB_REF)"; exit 1; }
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION exists: bump to a new version"; exit 1
          fi

      # Only a pinned compiler, without install scripts: nothing else runs before the hash is taken.
      - name: Build the package from the committed tree
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tooling --no-save --no-package-lock --ignore-scripts typescript@5.9.3 @types/node@24.19.1
          node cli/scripts/build-payload.ts
          /tmp/tooling/node_modules/.bin/tsc -p cli/tsconfig.json --typeRoots /tmp/tooling/node_modules/@types
          OUT="$(node cli/dist/cli.js --version)"
          [ "$OUT" = "$VERSION" ] || { echo "::error::the CLI reports '$OUT', expected $VERSION"; exit 1; }

      - name: Pack, and assert the tarball before anything is irreversible
        id: pack
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          cd cli
          npm pack --ignore-scripts --pack-destination /tmp/pack >/dev/null
          T="/tmp/pack/zz-meridian-$VERSION.tgz"
          test -f "$T" || { echo "::error::no tarball at $T"; exit 1; }
          tar -tzf "$T" > /tmp/list
          read -r FIRST < <(tar -xzOf "$T" package/dist/cli.js)
          [ "$FIRST" = '#!/usr/bin/env node' ] || { echo "::error::dist/cli.js starts '$FIRST', not the node shebang"; exit 1; }
          for f in payload/skills/zz-meridian/SKILL.md payload/skills/zz-meridian/references/existing-project.md payload/package.json payload/app/globals.css payload/scripts/gate.ts; do
            grep -qx "package/$f" /tmp/list || { echo "::error::tarball lacks $f"; exit 1; }
          done
          CARDS=$(grep -cE '^package/payload/src/components/[a-z]+/[a-z0-9-]+/index\.tsx$' /tmp/list || true)
          [ "$CARDS" -ge 60 ] || { echo "::error::only $CARDS component folders in the payload"; exit 1; }
          if grep -P '^package/(node_modules|test|scripts|src)/|^package/payload/(cli|\.github|\.claude|\.agents|node_modules|out|\.next)/|/\.env($|\.(?!example$))' /tmp/list; then
            echo "::error::the tarball holds a path that must never ship (above)"; exit 1
          fi
          tar -xzOf "$T" package/package.json > /tmp/pkg.json
          node -e 'const p=require("/tmp/pkg.json"); if (p.dependencies||p.optionalDependencies||p.peerDependencies) { console.error("::error::the package declares dependencies"); process.exit(1) } if (p.scripts && Object.keys(p.scripts).length) { console.error("::error::the package declares scripts"); process.exit(1) }'
          echo "sha256=$(sha256sum "$T" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "tarball OK: $CARDS components, $(wc -l < /tmp/list) files"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: /tmp/pack/zz-meridian-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  gates:
    needs: build
    runs-on: ubuntu-24.04
    # Measured on an Apple M5: about 1.5 minutes for the verify and 6.5 for the smoke. The 4-CPU runner is slower, so this
    # leaves room; tighten it from the first release run's log.
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0   # the template has no packageManager pin (0.2.0); CI names the pnpm it tests with
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The zz-meridian package's own tests (tests/cli-*): no adopted or created project has them, so the timed default
      # verify below leaves them out, and they run here, once.
      - name: The package's own tests
        run: pnpm exec vitest run tests/cli-
      # This runner is the reference profile for AC-4.8; its log, with the machine line, is the release's evidence.
      # 180 s, not the 120 s an adopter's own machine is held to: the same commit measured 111 s on one runner CPU and
      # 152 s on another, so the gate leaves room for the slower draw and still stops a default verify gone slow.
      - name: The default verify, from a clean build, within 180 s
        run: node cli/scripts/release-check.ts --limit 180
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-check
          path: out/
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: /tmp/pack
      - name: The consumer path, from the built tarball, with every published origin updated to finalize
        run: |
          set -euo pipefail
          T="/tmp/pack/zz-meridian-$VERSION.tgz"
          [ "$(sha256sum "$T" | cut -d' ' -f1)" = "$SHA256" ] || { echo "::error::the tarball is not the one build made"; exit 1; }
          node cli/scripts/smoke.ts --tarball "$T" --adopt --create --update

  publish:
    needs: [build, gates]
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm   # deployment branches: master only; named in npm's trusted-publisher setting
    permissions:
      contents: read
      id-token: write   # npm trusted publishing, and the provenance signature
    env:
      VERSION: ${{ inputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      # Node 24's own npm does the OIDC exchange: nothing is installed in the job that can publish.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: /tmp/pack

      - name: The tarball is the one build made and gates tested; npm can do trusted publishing
        run: |
          set -euo pipefail
          GOT="$(sha256sum "/tmp/pack/zz-meridian-$VERSION.tgz" | cut -d' ' -f1)"
          [ "$GOT" = "$SHA256" ] || { echo "::error::tarball hash $GOT is not $SHA256"; exit 1; }
          V="$(npm --version)"
          node -e 'const v=process.argv[1].split(".").map(Number); if (!(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1))))) { console.error("::error::npm "+process.argv[1]+" predates trusted publishing (need 11.5.1)"); process.exit(1) }' "$V"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo '::error::no OIDC token: permissions id-token: write'; exit 1; }

      # npm, not pnpm: pnpm publish does not perform the OIDC exchange.
      - name: Publish
        run: |
          set -euo pipefail
          LIVE="$(npm view "zz-meridian@$VERSION" version 2>/dev/null || true)"
          if [ "$LIVE" = "$VERSION" ]; then
            echo "::notice::zz-meridian $VERSION is already on the registry: skipping the publish"
          else
            npm publish "/tmp/pack/zz-meridian-$VERSION.tgz" --access public --provenance --ignore-scripts
          fi

      - name: Wait until the registry serves it
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            [ "$(npm view "zz-meridian@$VERSION" version 2>/dev/null || true)" = "$VERSION" ] && { echo "live"; exit 0; }
            echo "attempt $i: not visible yet"; sleep 10
          done
          echo "::error::zz-meridian $VERSION never became visible"; exit 1

  release:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the tag and the Release, both last
    env:
      VERSION: ${{ inputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # A failure here is an unsuccessful release, not a rollback: the version stays published and untagged.
      - name: A consumer runs it from the registry, and it is the tested tarball with provenance
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          OUT="$(npx --yes "zz-meridian@$VERSION" --version)"
          [ "$OUT" = "$VERSION" ] || { echo "::error::npx zz-meridian@$VERSION reported '$OUT'"; exit 1; }
          npm pack "zz-meridian@$VERSION" --ignore-scripts >/dev/null
          GOT="$(sha256sum "zz-meridian-$VERSION.tgz" | cut -d' ' -f1)"
          # The tested bytes passed the consumer path in `gates`; the registry's copy must be those bytes, since nothing reruns it.
          [ "$GOT" = "$SHA256" ] || { echo "::error::the registry's tarball hash $GOT differs from the tested $SHA256"; exit 1; }
          echo "the registry serves the tested tarball"
          # npm view prints nothing and exits 0 for a field that is not there, so the check reads the output.
          ATT="$(npm view "zz-meridian@$VERSION" dist.attestations.provenance --json 2>/dev/null || true)"
          [ -n "$ATT" ] || { echo "::error::zz-meridian $VERSION carries no provenance attestation"; exit 1; }
          echo "provenance attached"

      - name: Tag, last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA" >/dev/null
          echo "tagged v$VERSION at $GITHUB_SHA"

      - name: GitHub Release, with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" 'index($0, "## [" v "]")==1 {on=1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > /tmp/notes.md
          printf '\n---\nnpm: https://www.npmjs.com/package/zz-meridian/v/%s\n' "$VERSION" >> /tmp/notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/notes.md --verify-tag
