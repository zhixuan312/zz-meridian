# The weekly suites (decision 0010, docs/distribution.md): what is too slow or too statistical to gate a release, run on
# master's current commit. Weekly is weekly and release is release: nothing here runs in release.yml, and nothing runs
# twice. A failure fails this run and GitHub notifies; nothing waits on it.
#
# Each tier is a job of its own, on its own runner, and the jobs run in parallel. A red is rerun by its job alone
# ("Re-run failed jobs"), and a dispatch names the jobs it runs: `gh workflow run weekly.yml -f jobs=timed`.
#
# - `full`: `pnpm verify --full`, the complete suites; it judges no time.
# - `timed`: `pnpm verify --timed`, the timed suites alone; it judges every time.
# - `perf`: `pnpm verify --perf --shard <i>/5`, the 20-sample protocol split by route over 5 runners; a p95 over its
#   budget is a `warn` in the report, only a broken sample fails.
# - `consumer`: the consumer smoke from a tarball packed from this commit: the adopted project's default verify cases,
#   the update from each of the last three releases (adopted and created), and every recovery and failure case of the
#   update. The created project's `--verify` case (`--full --timed`) is not run here or in release.yml; it runs on request.
#
# Each job keeps its log as an artifact. This workflow holds no publishing permission and no credential.

name: weekly

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      jobs:
        description: 'The jobs to run, comma-separated without spaces: full,timed,perf,consumer'
        type: string
        default: full,timed,perf,consumer

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  # A dispatch's list, read before any job starts: a name that is not a job, or a space after a comma, would otherwise
  # skip that job silently, and a list naming none would end green having run nothing.
  named:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every name is a job
        env:
          JOBS: ${{ inputs.jobs || 'full,timed,perf,consumer' }}
        run: |
          set -euo pipefail
          IFS=',' read -ra names <<< "$JOBS"
          [ "${#names[@]}" -gt 0 ] || { echo "jobs names no job: give some of full,timed,perf,consumer"; exit 1; }
          for n in "${names[@]}"; do
            case "$n" in
              full|timed|perf|consumer) ;;
              *) echo "jobs: '$n' is not a job; name some of full,timed,perf,consumer, comma-separated without spaces"; exit 1 ;;
            esac
          done

  full:
    needs: named
    if: contains(format(',{0},', inputs.jobs || 'full,timed,perf,consumer'), ',full,')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify --full
        run: |
          set -euo pipefail
          mkdir -p out
          pnpm verify --full 2>&1 | tee out/weekly-full.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: full
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  timed:
    needs: named
    if: contains(format(',{0},', inputs.jobs || 'full,timed,perf,consumer'), ',timed,')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify --timed
        run: |
          set -euo pipefail
          mkdir -p out
          pnpm verify --timed 2>&1 | tee out/weekly-timed.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: timed
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  perf:
    needs: named
    if: contains(format(',{0},', inputs.jobs || 'full,timed,perf,consumer'), ',perf,')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify --perf, shard ${{ matrix.shard }} of 5 (a report)
        run: |
          set -euo pipefail
          mkdir -p out
          pnpm verify --perf --shard ${{ matrix.shard }}/5 2>&1 | tee out/weekly-perf.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  consumer:
    needs: named
    if: contains(format(',{0},', inputs.jobs || 'full,timed,perf,consumer'), ',consumer,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The same build and pack as release.yml's `build` job, without its release checks.
      - name: Pack this commit
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tooling --no-save --no-package-lock --ignore-scripts typescript@5.9.3 @types/node@24.19.1
          node cli/scripts/build-payload.ts
          /tmp/tooling/node_modules/.bin/tsc -p cli/tsconfig.json --typeRoots /tmp/tooling/node_modules/@types
          # master usually carries a version already on npm, and `update` refuses a running package whose bytes differ
          # from the published one. Labelled as the next patch, which is not published yet, it updates as the release's
          # own tarball does in `gates`.
          node -e 'const f="cli/package.json",p=JSON.parse(require("fs").readFileSync(f,"utf8")),[a,b,c]=p.version.split(".").map(Number);p.version=`${a}.${b}.${c+1}`;require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n");console.log(`packed as ${p.version}`)'
          mkdir -p /tmp/pack
          (cd cli && npm pack --ignore-scripts --pack-destination /tmp/pack >/dev/null)
          ls /tmp/pack/zz-meridian-*.tgz
      - name: The adopted project's default verify cases, the update from the last three releases, and its recovery and failure cases
        run: |
          set -euo pipefail
          mkdir -p out
          node cli/scripts/smoke.ts --tarball "$(ls /tmp/pack/zz-meridian-*.tgz)" --adopt --update --origins 3 --update-all --verify 2>&1 | tee out/weekly-consumer.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consumer
          path: out/
          if-no-files-found: ignore
          retention-days: 30
