# The weekly run (decision 0010, docs/distribution.md): the test commands on master's current commit, on their own
# runners, plus the consumer path from a tarball packed from that commit. A failure fails this run and GitHub notifies;
# nothing waits on it. This workflow holds no publishing permission and no credential: the Postgres password below is
# the service container's own, which exists only for the job.
#
# A fresh clone has no `out/last-green` marker and no diff from master, so each command runs its whole tier. That is the
# point of a scheduled run: nothing is skipped for lack of evidence.
#
# - `t2`: `pnpm test:t2`, the scheduled tier run. On this checkout it covers the whole Tier 2 set and the whole Tier 1
#   set, the 20-sample protocol included because `CI` is true and no marker narrows the run.
# - `release`: `pnpm test:release` (every Tier 1 and Tier 2 test, the timed browser suites, lint, the type check, a
#   production build) with the Postgres services configured, so its Postgres suite runs rather than reporting `not run`.
# - `consumer`: the consumer smoke from a tarball packed from this commit: the adopted project's own `test:t2`, a
#   dashboard created from the tarball running its own `test:release`, the update from each of the last three releases
#   (adopted and created), and every recovery and failure case of the update.
#
# Each job keeps its log as an artifact.

name: weekly

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      jobs:
        description: 'The jobs to run, comma-separated without spaces: t2,release,consumer'
        type: string
        default: t2,release,consumer

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  # A dispatch's list, read before any job starts: a name that is not a job, or a space after a comma, would otherwise
  # skip that job silently, and a list naming none would end green having run nothing.
  named:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every name is a job
        env:
          JOBS: ${{ inputs.jobs || 't2,release,consumer' }}
        run: |
          set -euo pipefail
          IFS=',' read -ra names <<< "$JOBS"
          [ "${#names[@]}" -gt 0 ] || { echo "jobs names no job: give some of t2,release,consumer"; exit 1; }
          for n in "${names[@]}"; do
            case "$n" in
              t2|release|consumer) ;;
              *) echo "jobs: '$n' is not a job; name some of t2,release,consumer, comma-separated without spaces"; exit 1 ;;
            esac
          done

  t2:
    needs: named
    if: contains(format(',{0},', inputs.jobs || 't2,release,consumer'), ',t2,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The template snapshot the package carries
        run: node cli/scripts/build-payload.ts
      - name: test:t2
        run: |
          set -euo pipefail
          mkdir -p out
          google-chrome --version | tee out/weekly-t2.txt
          pnpm test:t2 2>&1 | tee -a out/weekly-t2.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: t2
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  release:
    needs: named
    if: contains(format(',{0},', inputs.jobs || 't2,release,consumer'), ',release,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U meridian" --health-interval 2s --health-timeout 5s --health-retries 30
      # One server connection, so the advisory-lock case is the same on every run.
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
        env:
          DB_HOST: postgres
          DB_USER: meridian
          DB_PASSWORD: meridian
          DB_NAME: meridian_test
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          DEFAULT_POOL_SIZE: '1'
          LISTEN_PORT: '6432'
        ports: ['6432:6432']
    env:
      CHROME: /usr/bin/google-chrome
      MERIDIAN_POSTGRES_URL: postgres://meridian:meridian@127.0.0.1:5432/meridian_test
      MERIDIAN_POOLER_URL: postgres://meridian:meridian@127.0.0.1:6432/meridian_test
      MERIDIAN_PG: /tmp/pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The template snapshot the package carries
        run: node cli/scripts/build-payload.ts
      - name: pg, which the template does not install
        run: npm install --prefix /tmp/pg --no-save --no-package-lock --ignore-scripts pg@8.23.1
      - name: test:release, the Postgres suite included
        run: |
          set -euo pipefail
          mkdir -p out
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 6432 -U meridian && break; sleep 1; done
          pnpm test:release 2>&1 | tee out/weekly-release.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  consumer:
    needs: named
    if: contains(format(',{0},', inputs.jobs || 't2,release,consumer'), ',consumer,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The same build and pack as release.yml's `build` job, without its release checks.
      - name: Pack this commit
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tooling --no-save --no-package-lock --ignore-scripts typescript@5.9.3 @types/node@24.19.1
          node cli/scripts/build-payload.ts
          /tmp/tooling/node_modules/.bin/tsc -p cli/tsconfig.json --typeRoots /tmp/tooling/node_modules/@types
          # master usually carries a version already on npm, and `update` refuses a running package whose bytes differ
          # from the published one. Labelled as the next patch, which is not published yet, it updates as the release's
          # own tarball does in `gates`.
          node -e 'const f="cli/package.json",p=JSON.parse(require("fs").readFileSync(f,"utf8")),[a,b,c]=p.version.split(".").map(Number);p.version=`${a}.${b}.${c+1}`;require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n");console.log(`packed as ${p.version}`)'
          mkdir -p /tmp/pack
          (cd cli && npm pack --ignore-scripts --pack-destination /tmp/pack >/dev/null)
          ls /tmp/pack/zz-meridian-*.tgz
      - name: The adopted project's own test:t2, a created dashboard's test:release, the update from the last three releases, and its recovery and failure cases
        run: |
          set -euo pipefail
          mkdir -p out
          node cli/scripts/smoke.ts --tarball "$(ls /tmp/pack/zz-meridian-*.tgz)" --adopt --create --update --origins 3 --update-all --verify 2>&1 | tee out/weekly-consumer.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consumer
          path: out/
          if-no-files-found: ignore
          retention-days: 30
